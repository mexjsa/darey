<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrador Documental | DAREY Ajustadores S.C.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --azul-darey: #0089A9;
      --azul-profundo: #005A82;
      --cian: #00B2CF;
      --amarillo-darey: #F8C400;
      --carbon: #202124;
      --blanco: #FFFFFF;
      --bg: #F4F9FB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--azul-profundo);
      background: linear-gradient(135deg, #001A26 0%, #00364F 50%, #005A82 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--blanco);
    }
    .portal-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
    }
    .portal-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0089A9 0%, #00B2CF 100%);
      color: white;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 10px 25px rgba(0, 178, 207, 0.3);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(248, 196, 0, 0.15);
      border: 1px solid rgba(248, 196, 0, 0.4);
      color: var(--amarillo-darey);
      border-radius: 50px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.25;
    }
    p {
      font-size: 14.5px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.65;
      margin-bottom: 30px;
    }
    .status-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 30px;
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00E676;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 10px #00E676;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      background: var(--azul-darey);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      border-radius: 50px;
      transition: all 0.3s ease;
    }
    .btn-back:hover {
      background: var(--amarillo-darey);
      color: var(--carbon);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="portal-card">
    <div class="portal-icon">
      <i class="fa-solid fa-folder-tree"></i>
    </div>
    <div class="badge">
      <i class="fa-solid fa-lock"></i> Acceso Operativo
    </div>
    <h1>Integrador Documental DAREY</h1>
    <p>
      Módulo de carga, validación e integración pericial de cuadernillos digitales para personal operativo, ajustadores en campo y socios autorizados.
    </p>

    <div class="status-box">
      <span class="status-dot"></span>
      <span>Módulo listo para conexión con el repositorio operativo</span>
    </div>

    <a href="../" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Volver al Portal Principal
    </a>
  </div>
</body>
</html>
